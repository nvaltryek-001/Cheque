name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python packages
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        # dataset-dependent tests are skipped automatically: datasets are private and not in git
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest-output.txt
      - name: Annotate test failures
        if: failure()
        working-directory: backend
        run: |
          grep -E "^(FAILED|ERROR)|Error:" pytest-output.txt | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: Frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: Frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chequeverify .
      - name: Start container (root-owned /data, like a hosted persistent disk)
        run: |
          sudo mkdir -p /srv/cvdata && sudo chown root:root /srv/cvdata && sudo chmod 755 /srv/cvdata
          docker run -d --name cv -p 8000:8000 -v /srv/cvdata:/data \
            -e CV_ADMIN_PASSWORD=Ci-pass-12345 chequeverify
          for i in $(seq 1 45); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
      - name: Live workflow smoke test inside the container
        run: docker exec cv python tests/smoke_live.py http://127.0.0.1:8000 Ci-pass-12345
      - name: Server runs unprivileged and data is private
        run: |
          docker top cv -eo uid,args | tee /dev/stderr | grep "run.py --prod" | awk '{print $1}' | grep -qx 10001
          sudo stat -c "%a %u" /srv/cvdata/instance/chequeverify.db | tee /dev/stderr | grep -qx "600 10001"
      - name: Data survives a container restart
        run: |
          docker restart cv
          for i in $(seq 1 45); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          TOKEN=$(curl -fs -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Ci-pass-12345"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["token"])')
          curl -fs "http://127.0.0.1:8000/api/cheques" -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["meta"]["total"]>=1,d;print("cheques after restart:",d["meta"]["total"])'
      - name: Container logs
        if: always()
        run: docker logs cv
