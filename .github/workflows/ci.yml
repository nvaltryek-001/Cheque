name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python packages
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        # dataset-dependent tests are skipped automatically: datasets are private and not in git
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest-output.txt
      - name: Annotate test failures
        if: failure()
        working-directory: backend
        run: |
          grep -E "^(FAILED|ERROR)|Error:" pytest-output.txt | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: Frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: Frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chequeverify .
      - name: Smoke test
        run: |
          docker run -d --name cv -p 8000:8000 -e CV_ADMIN_PASSWORD=Ci-pass-12345 chequeverify
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fs http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          docker logs cv
